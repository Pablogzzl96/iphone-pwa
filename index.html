<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <!-- viewport-fit=cover permite usar toda la pantalla (notch / Dynamic Island) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tracker</title>
  <meta name="description" content="Tracker personal de nutrición y peso. Offline, sin cuentas; los datos viven solo en el dispositivo." />

  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#1E2A38" />

  <!-- Específico de iOS / Safari -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Tracker" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />

  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <main id="view" class="app">
    <section class="screen"><p class="muted">Cargando…</p></section>
  </main>

  <nav id="tabbar" class="tabbar" hidden>
    <a href="#/hoy" data-ruta="hoy"><span aria-hidden="true">◉</span>Hoy</a>
    <a href="#/peso" data-ruta="peso"><span aria-hidden="true">⚖︎</span>Peso</a>
    <a href="#/progreso" data-ruta="progreso"><span aria-hidden="true">↗︎</span>Progreso</a>
    <a href="#/ajustes" data-ruta="ajustes"><span aria-hidden="true">⚙︎</span>Ajustes</a>
  </nav>

  <div id="sheets"></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <div class="toast update" id="update-toast" hidden>
    <span>Hay una versión nueva.</span>
    <button type="button" id="update-btn">Actualizar</button>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
